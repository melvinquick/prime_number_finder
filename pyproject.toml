[project]
name = "prime_number_finder"
version = "2.0.0"
description = "Python program for finding/checking Prime Numbers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Melvin Quick", email = "melvinquick@proton.me" }]
requires-python = ">=3.11"
dependencies = ["pyside6>=6.12.0", "pyyaml>=6.0.3"]

[project.urls]
repository = "https://github.com/melvinquick/prime_number_finder"
issues = "https://github.com/melvinquick/prime_number_finder/issues"

[project.gui-scripts]
prime-number-finder = "prime_number_finder.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["bandit>=1.9.4"]
